org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows-only workaround: the project checkout lives on a different drive
# letter (H:) than the pub cache (C:), and Kotlin's incremental compiler
# cache can't compute a relative path across drives, crashing
# `compileDebugKotlin` for Kotlin-based plugins like `record_android`. See
# https://youtrack.jetbrains.com/issue/KT-... (relative path across roots).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
