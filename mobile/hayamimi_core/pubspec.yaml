name: hayamimi_core
description: >-
  On-device CPU speech recognition for Flutter: live sherpa-onnx
  transcription, a remote hayamimi client, and a LAN subtitle broadcast
  server.
version: 0.1.0
homepage: https://github.com/oboroge0/hayamimi
repository: https://github.com/oboroge0/hayamimi
issue_tracker: https://github.com/oboroge0/hayamimi/issues
topics:
  - speech-recognition
  - subtitles
  - asr
  - realtime

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^1.13.6
  record: ^6.0.0
  archive: ^4.2.0
  crypto: ^3.0.7
  unorm_dart: ^0.3.2
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
