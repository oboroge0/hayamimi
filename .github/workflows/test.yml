name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sherpa-onnx numpy soundfile ctranslate2 sentencepiece pytest
      - run: python -m pytest tests -q
